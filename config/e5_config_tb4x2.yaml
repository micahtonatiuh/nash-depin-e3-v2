# =====================================================================
# e5_config_tb4x2.yaml — HOMOGENEOUS run: TurtleBot4 x 2
#
# This is the configuration for the TB4xTB4 physical transfer runs whose
# results are in e5_det_seed2/ and e5_det_seed4/ (200 steps per episode).
# For the heterogeneous LoCoBot+TB4 runs use e5_config.yaml instead.
#
# Rewards are IDENTICAL to E2 — do not modify, they guarantee the
# sim-to-real comparison.
# =====================================================================

experiment: "physical_transfer_tb4x2"

robot_platform:
  - tb4
  - tb4

# --- Environment (exact mirror of the E2 environment) ---
environment:
  task_cell: [0, 0]            # fixed station (same as E2 num_tasks=1)
  start_cells: [[4, 0], [0, 4]]  # agent_0, agent_1
  steps_per_episode: 200                # TB4x2 runs use 200
  task_reward: 10.0            # = E2
  collision_penalty: -5.0      # = E2
  cooperation_reward: 2.0      # = E2
  coop_distance: 1             # = E2 (Manhattan)

# --- Physical mapping / calibration / motion control ---
physical:
  grid_size: 5
  cell_size_m: 0.618           # 3.0 x 3.0 m arena
  cell_error_max_m: 0.15       # per-cell drift threshold
  origin_x_m: 0.0              # odom-x of cell (0,0). Calibrate per arena.
  origin_y_m: 0.0              # odom-y of cell (0,0). Calibrate per arena.
  linear_speed: 0.2            # m/s, conservative for odometric accuracy
  angular_speed: 0.5           # rad/s
  pos_tolerance_m: 0.03        # tolerance when closing the one-cell advance
  yaw_tolerance_rad: 0.05      # tolerance when closing the rotation (~2.9 deg)

# --- Phases ---
phases:
  frozen_episodes: 20
  finetune_episodes: 30
  safety_episodes: 5           # reduced speed for the first N episodes
  save_every: 5                # save Q-tables every N eps during finetune

# --- Learning (PhysicalNashTeam) ---
learning:
  alpha_finetune: 0.05         # fine-tuning rate
  gamma: 0.95                  # = E2
  epsilon: 0.05                # exploration in finetune (forced to 0 in frozen)
  use_equity: true             # egalitarian refinement

# --- Transferred Q-tables (overridden by --seed) ---
qtables:
  agent_0: qtables_e5/seed_2_agent_0.npz
  agent_1: qtables_e5/seed_2_agent_1.npz

# --- Preregistered threshold (see README on the scope of physical Gini) ---
hypothesis:
  gini_median_max: 0.15

# --- ROS2 ---
ros:
  cmd_vel_topic: "cmd_vel"     # published on /{namespace}/cmd_vel
  odom_topic: "odom"           # subscribed on /{namespace}/odom
  robots:
    - namespace: "tb1"
    - namespace: "tb2"
